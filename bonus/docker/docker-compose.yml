# Optional observability stack for Lab 25: Prometheus + Grafana + a GPU cost exporter.
# Usage: docker compose up -d (local demo; ports bind only to localhost).
name: gpufinops-bonus
services:
  exporter:
    image: python:3.12-slim
    working_dir: /app
    command: python exporter.py
    environment:
      LAB_DATA_DIR: /data
      PORT: "9101"
      BIND_HOST: "0.0.0.0"
    volumes:
      - ./exporter.py:/app/exporter.py:ro
      - ../../data:/data:ro
    ports: ["127.0.0.1:${EXPORTER_PORT:-9101}:9101"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    depends_on:
      exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
